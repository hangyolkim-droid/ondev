[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ondev"
version = "0.1.0"
description = "The on-device LLM builder: model + device → optimized, packaged, reproducibly measured local runtime."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Han Kim" }]
keywords = ["llm", "on-device", "edge-ai", "android", "termux", "llama.cpp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
ondev = "ondev.cli:main"

[tool.setuptools]
packages = ["ondev"]
